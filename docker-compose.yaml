services:

  
  # 1. FastAPI Application
  api:
    build: .
    image: koinstrap-api:latest   
    container_name: koinstrap_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  # 2. Airflow Webserver
  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.3}
    user: "0:0"

    container_name: koinstrap_airflow_webserver
    restart: always

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    command: webserver

  # 3. Airflow Scheduler
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.3}
    user: "0:0"

    container_name: koinstrap_airflow_scheduler
    restart: always

    env_file:
      - .env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler
